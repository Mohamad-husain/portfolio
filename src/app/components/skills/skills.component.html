<section class="page-section skills" id="skills">
  <div class="container">
    <div class="skills-header text-center reveal" style="--delay: 0.05s;">
      <h2 class="section-title">Skills & Technologies</h2>
      <p class="skills-subtitle">A structured view of my core technologies and tools.</p>
    </div>

    <div class="skills-groups">
      <div class="skill-group reveal" *ngFor="let category of categories; let i = index"
        [style.--delay]="(i * 0.12 + 0.15) + 's'">
        <div class="group-header">
          <h3 class="group-title">{{ category.title }}</h3>
          <span class="group-count">{{ category.items.length }}</span>
        </div>

        <div class="skill-items">
          <div class="skill-pill" *ngFor="let skill of category.items">
            <img [src]="skill.icon" [alt]="skill.name">
            <span>{{ skill.name }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
