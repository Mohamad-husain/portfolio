<section class="page-section projects">
  <div class="container">
    <h2 class="section-title mb-5 text-center fade-in-up" style="--delay: 0.05s;">My Works</h2>

    <div class="row g-4">
      <div class="col-lg-6 col-md-6 col-sm-12" *ngFor="let project of projects; let i = index">
        <div class="project-card fade-in-up" [style.--delay]="(i * 0.12 + 0.15) + 's'">
          <div class="project-image">
            <img [src]="project.image" alt="{{project.title}}" class="img-fluid">
            <span class="project-badge">{{ project.type }}</span>
          </div>

          <div class="project-content">
            <h4 class="project-title">
              {{project.title}}
            </h4>

            <p class="project-desc">
              {{project.fullDescription}}
            </p>

            <div class="tech-stack">
              <span class="tech-badge" *ngFor="let tech of project.technologies">
                {{tech}}
              </span>
            </div>

            <div class="project-links">
              <a [href]="project.github" target="_blank" rel="noopener" class="project-link" [class.is-hidden]="!project.github">
                <i class="fab fa-github"></i> GitHub
              </a>
              <a [href]="project.behance" target="_blank" rel="noopener" class="project-link" [class.is-hidden]="!project.behance">
                <i class="fab fa-behance"></i> Behance
              </a>
<!--              <a [href]="project.live" target="_blank">-->
<!--                <i class="fas fa-external-link-alt"></i> Link-->
<!--              </a>-->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
