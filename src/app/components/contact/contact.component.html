<section class="page-section" id="contact">
  <div class="container text-center fade-in">
    <h2 class="section-title mb-3 fade-in">
      Contact <span class="highlight">Me</span>
    </h2>
    <div class="row justify-content-center mt-4">
      <div class="col-lg-8">
        <div class="contact-form fade-in">
          <p class="form-title">Send Mail & Let Comment</p>
          <form>
            <div class="mb-3 fade-in">
              <input
                type="text"
                class="form-control"
                placeholder="Your name"
              />
            </div>
            <div class="mb-3 fade-in">
              <input
                type="email"
                class="form-control"
                placeholder="your@example.com"
              />
            </div>
            <div class="mb-3 fade-in">
              <textarea
                class="form-control"
                rows="5"
                placeholder="Write your message..."
              ></textarea>
            </div>
            <div class="d-flex justify-content-center gap-3 fade-in">
              <button type="submit" class="btn-gradient">
                Send <i class="bi bi-send-fill ms-1"></i>
              </button>
            </div>
          </form>
        </div>

        <div class="social-icons mt-4 fade-in">
          <a href="https://wa.me/+972598610880" target="_blank"><i class="bi bi-whatsapp"></i></a>
          <a href="https://t.me/+972598610880" target="_blank"><i class="bi bi-telegram"></i></a>
        </div>
      </div>
    </div>
  </div>
</section>
